<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
    <title>Weather Forecast</title>
   
</head>
<body>
    <div id="app">
        <!-- search bar -->
        <div id="searchBar">
            <input type="text" id="searchBarInput" placeholder="Search by city" onkeypress="handleKeyPress(event)">
            <button id="searchIcon" onclick="getWeather()">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <!-- loading indicator -->
        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner"></i>
        </div>
        
        <!-- error message -->
        <div id="errorMessage"></div>
        
        <!-- main weather info -->
        <div id="info">
            <p id="date"></p>
            <h2 id="city"></h2>
            <p id="country"></p>
        </div>

        <!-- weather icon -->
        <div id="tempImg"></div>

        <!-- description -->
        <div id="description"></div>

        <!-- temperature -->
        <div id="temp"></div>
        <div id="feelsLike"></div>

        <!-- extra info -->
        <div id="extraInfo">
            <div class="info-card">
                <i class="fas fa-temperature-high"></i>
                <h5>High</h5>
                <p id="tempMax"></p>
            </div>
            <div class="info-card">
                <i class="fas fa-temperature-low"></i>
                <h5>Low</h5>
                <p id="tempMin"></p>
            </div>
            <div class="info-card">
                <i class="fas fa-wind"></i>
                <h5>Wind</h5>
                <p id="windSpeed"></p>
            </div>
            <div class="info-card">
                <i class="fas fa-tint"></i>
                <h5>Humidity</h5>
                <p id="humidity"></p>
            </div>
        </div>
        
        <!-- hourly forecast -->
        <div id="hourlyForecast">
            <h3>24-Hour Forecast</h3>
            <div id="hourlyContainer"></div>
        </div>
    </div>

   <script src="index.js"></script>
</body>
</html>
